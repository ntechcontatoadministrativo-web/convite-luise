<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lista de convidados · Luise</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --papel:#f8ece6; --papel-2:#fdf6f2; --vinho:#8c1c3a; --rosa:#e9a8b5; --rosa-claro:#f6d5db; --tinta:#5a2a35; --suave:#9a6f78; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--papel); color:var(--tinta); font:400 17px/1.5 "Cormorant Garamond", Georgia, serif;
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: hidden; }
  main { max-width: 1000px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font: 400 52px/1 "Great Vibes", cursive; color: var(--vinho); margin: 0; }
  h2 { font: 400 34px/1 "Great Vibes", cursive; color: var(--vinho); margin: 0 0 10px; }
  .resumo { display:flex; flex-wrap:wrap; gap:10px; }
  .resumo div { background:var(--papel-2); border:1px solid var(--rosa); border-radius:6px; padding:10px 18px; min-width: 140px; }
  .resumo b { display:block; font-size:34px; font-weight:600; color:var(--vinho); font-variant-numeric: lining-nums tabular-nums; line-height: 1.1; }
  .resumo span { color:var(--suave); font-size:13px; text-transform:uppercase; letter-spacing:.14em; }
  .caixa { background: var(--papel-2); border:1px solid var(--rosa); border-radius:6px; padding: 18px; }
  .tabela { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width: 620px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--rosa-claro); vertical-align: top; }
  th { font-size:13px; text-transform:uppercase; letter-spacing:.14em; color:var(--vinho); font-weight:600; }
  td.n { font-variant-numeric: lining-nums tabular-nums; }
  .pill { font-size:14px; padding:1px 10px; border-radius:999px; white-space: nowrap; font-weight: 600; }
  .sim { background: #e3f1e4; color:#2f6b3a; } .nao { background: var(--rosa-claro); color: var(--vinho); }
  .grade { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:8px; }
  .conv { display:flex; align-items:center; gap:10px; border-radius:6px; padding:8px 12px; border:1px solid var(--rosa-claro); background:#fff; min-width:0; }
  .conv i { font-style:normal; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:700; flex:none; }
  .conv.vai i { background:#e3f1e4; color:#2f6b3a; } .conv.nao i { background:var(--rosa-claro); color:var(--vinho); } .conv.pendente i { border:1px dashed var(--rosa); color:var(--suave); }
  .conv.pendente { color: var(--suave); }
  .conv b { font-weight:600; display:block; } .conv small { display:block; color:var(--suave); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv div { min-width:0; }
  select { background:#fff; border:1px solid var(--rosa); color:var(--tinta); border-radius:999px; padding:4px 10px; font: inherit; }
  button { background:#fff; border:1px solid var(--rosa); color:var(--tinta); border-radius:999px; padding:5px 14px; cursor:pointer; font: inherit; }
  button.conf { border-color: var(--vinho); color: #fff; background: var(--vinho); }
  .acoes { display:flex; gap:8px; flex-wrap: wrap; margin: 0; }
  .acoes button { background: var(--vinho); color: #fff3f5; border-color: var(--vinho); padding: 8px 18px; }
  form { display:flex; gap:8px; flex-wrap:wrap; align-items: center; }
  input { background:#fff; border:1px solid var(--rosa); color:var(--tinta); padding:10px 16px; border-radius:999px; font: inherit; }
  .erro { color: var(--vinho); font-style: italic; }
  .vazio { color: var(--suave); font-style: italic; margin: 0; }
  [hidden] { display: none !important; }
  #painel { display: grid; gap: 22px; }

  /* celular: resumo 2×2, botões largos, convidados em 2 colunas e respostas como cartões */
  @media (max-width: 640px) {
    body { font-size: 17px; }
    main, #painel { gap: 16px; }
    h1 { font-size: 42px; text-align: center; }
    h2 { font-size: 30px; }
    .resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .resumo div { min-width: 0; padding: 10px 12px; text-align: center; }
    .resumo b { font-size: 30px; }
    .resumo span { font-size: 11px; letter-spacing: .1em; }
    .acoes { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .acoes button { width: 100%; padding: 12px 16px; font-size: 17px; }
    .caixa { padding: 14px 12px; }
    .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .conv { padding: 7px 8px; gap: 8px; }
    .conv i { width: 22px; height: 22px; font-size: 13px; }
    .conv b { font-size: 16px; line-height: 1.2; }
    .conv small { font-size: 13px; }
    form#login { display: grid; grid-template-columns: 1fr; }
    form#login input, form#login button { width: 100%; padding: 12px 16px; }

    table { min-width: 0; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    #linhas tr { background: #fff; border: 1px solid var(--rosa-claro); border-radius: 6px; padding: 8px 12px; margin-bottom: 8px;
      display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
    #linhas td { border: 0; padding: 2px 0; }
    #linhas td:empty { display: none; }
    #linhas td::before { content: attr(data-rotulo) ": "; color: var(--suave); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
    #linhas td:nth-child(1) { font-weight: 600; font-size: 18px; grid-column: 1; }
    #linhas td:nth-child(1)::before, #linhas td:nth-child(3)::before, #linhas td:nth-child(7)::before { content: none; }
    #linhas td:nth-child(3) { grid-column: 2; grid-row: 1; text-align: right; }
    #linhas td:nth-child(2), #linhas td:nth-child(4), #linhas td:nth-child(5), #linhas td:nth-child(6) { grid-column: 1 / -1; }
    #linhas td:nth-child(5) { font-style: italic; }
    #linhas td:nth-child(7) { grid-column: 1 / -1; text-align: right; }
    #fora tr { background: #fff; border: 1px solid var(--rosa-claro); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
    #fora td { border: 0; padding: 2px 0; }
    #fora select { width: 100%; margin-top: 6px; padding: 9px 12px; }
  }
</style>
</head>
<body>
<main>
  <h1>Lista de convidados</h1>
  <form id="login" hidden>
    <input id="chave" type="password" placeholder="Senha" autocomplete="current-password">
    <button type="submit">Entrar</button>
    <span class="erro" id="erro"></span>
  </form>
  <div id="painel" hidden>
    <div class="resumo">
      <div><b id="r-pessoas">0</b><span>pessoas vão</span></div>
      <div><b id="r-sim">0</b><span>confirmaram</span></div>
      <div><b id="r-nao">0</b><span>não vão</span></div>
      <div><b id="r-pend">0</b><span>sem resposta</span></div>
    </div>
    <p class="acoes"><button type="button" id="copiar">Copiar lista de quem vai</button><button type="button" id="copiar-pend">Copiar quem falta responder</button><button type="button" id="atualizar">Atualizar</button></p>
    <div class="caixa">
      <h2>Convidados</h2>
      <div class="grade" id="grade"></div>
    </div>
    <div class="caixa" id="caixa-fora" hidden>
      <h2>Não reconhecidos</h2>
      <p class="vazio" style="margin-bottom:10px">Respostas com nomes que não bati com a lista. Escolha quem é para descontar.</p>
      <div class="tabela"><table><tbody id="fora"></tbody></table></div>
    </div>
    <div class="caixa">
      <h2>Respostas</h2>
      <div class="tabela"><table>
        <thead><tr><th>Escreveu</th><th>Na lista</th><th>Resposta</th><th>Pessoas</th><th>Recado</th><th>Quando</th><th></th></tr></thead>
        <tbody id="linhas"></tbody>
      </table></div>
      <p class="vazio" id="sem-resp" hidden>Nenhuma resposta ainda.</p>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let chave = new URLSearchParams(location.search).get('chave') || (() => { try { return sessionStorage.getItem('chave') || ''; } catch { return ''; } })();
  let dados = { lista: [], respostas: [], foraDaLista: [] };

  async function carrega() {
    const r = await fetch('/api/admin/lista?chave=' + encodeURIComponent(chave));
    if (!r.ok) { $('login').hidden = false; $('painel').hidden = true; if (chave) $('erro').textContent = 'Senha incorreta.'; return; }
    try { sessionStorage.setItem('chave', chave); } catch {}
    dados = await r.json();
    $('login').hidden = true; $('painel').hidden = false;
    const sim = dados.respostas.filter(d => d.vai);
    $('r-pessoas').textContent = sim.reduce((s, d) => s + d.pessoas, 0);
    $('r-sim').textContent = sim.length;
    $('r-nao').textContent = dados.respostas.length - sim.length;
    $('r-pend').textContent = dados.lista.filter(c => c.status === 'pendente').length;
    const grade = $('grade'); grade.innerHTML = '';
    for (const c of dados.lista) {
      const el = document.createElement('div'); el.className = 'conv ' + c.status;
      const i = document.createElement('i'); i.textContent = c.status === 'vai' ? '✓' : c.status === 'nao' ? '✕' : '?';
      const tx = document.createElement('div');
      const b = document.createElement('b'); b.textContent = c.convidado + (c.pessoas > 1 ? ' (+' + (c.pessoas - 1) + ')' : '');
      const sm = document.createElement('small');
      sm.textContent = c.status === 'pendente' ? 'sem resposta' : (c.status === 'vai' ? 'vai' : 'não vai') + ' · escreveu "' + c.digitou + '"';
      tx.append(b, sm); el.append(i, tx); grade.appendChild(el);
    }
    const fora = $('fora'); fora.innerHTML = '';
    $('caixa-fora').hidden = !dados.foraDaLista.length;
    for (const r of dados.foraDaLista) {
      const tr = document.createElement('tr');
      const td1 = document.createElement('td'); td1.textContent = r.nome + ' — ' + (r.vai ? 'vai' + (r.pessoas > 1 ? ' (+' + (r.pessoas - 1) + ')' : '') : 'não vai');
      const td2 = document.createElement('td');
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="">É quem da lista?</option>';
      dados.lista.forEach(c => { const o = document.createElement('option'); o.value = c.convidado; o.textContent = c.convidado + (c.status !== 'pendente' ? ' (já respondeu)' : ''); sel.appendChild(o); });
      sel.onchange = async () => {
        if (!sel.value) return;
        await fetch('/api/admin/' + r.id + '?chave=' + encodeURIComponent(chave), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ convidado: sel.value }) });
        carrega();
      };
      td2.appendChild(sel); tr.append(td1, td2); fora.appendChild(tr);
    }
    const tb = $('linhas'); tb.innerHTML = '';
    $('sem-resp').hidden = dados.respostas.length > 0;
    for (const d of dados.respostas) {
      const tr = document.createElement('tr');
      const ROTULOS = ['Escreveu', 'Na lista', 'Resposta', 'Pessoas', 'Recado', 'Quando', ''];
      const cel = (txt, cls) => { const td = document.createElement('td'); td.textContent = txt ?? ''; if (cls) td.className = cls; td.dataset.rotulo = ROTULOS[tr.children.length]; tr.appendChild(td); return td; };
      cel(d.nome);
      cel(d.convidado || '—');
      const p = document.createElement('span'); p.className = 'pill ' + (d.vai ? 'sim' : 'nao'); p.textContent = d.vai ? 'Vai' : 'Não vai'; cel('').appendChild(p);
      cel(d.vai ? d.pessoas : '–', 'n');
      cel(d.mensagem);
      cel(new Date(d.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }), 'n');
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Remover';
      b.onclick = async () => {
        if (b.dataset.ok !== '1') { b.dataset.ok = '1'; b.textContent = 'Confirmar?'; b.className = 'conf'; return; }
        await fetch('/api/admin/' + d.id + '?chave=' + encodeURIComponent(chave), { method: 'DELETE' });
        carrega();
      };
      cel('').appendChild(b);
      tb.appendChild(tr);
    }
  }
  async function copia(btn, txt, rotulo) {
    try { await navigator.clipboard.writeText(txt); btn.textContent = 'Copiado!'; } catch { btn.textContent = 'Não foi possível copiar'; }
    setTimeout(() => btn.textContent = rotulo, 1800);
  }
  $('login').addEventListener('submit', (e) => { e.preventDefault(); chave = $('chave').value; carrega(); });
  $('atualizar').onclick = carrega;
  $('copiar').onclick = () => copia($('copiar'),
    dados.respostas.filter(d => d.vai).map((d, i) => `${i + 1}. ${d.nome}${d.pessoas > 1 ? ' (+' + (d.pessoas - 1) + ')' : ''}`).join('\n'), 'Copiar lista de quem vai');
  $('copiar-pend').onclick = () => copia($('copiar-pend'), dados.lista.filter(c => c.status === 'pendente').map(c => c.convidado).join('\n'), 'Copiar quem falta responder');
  carrega();
</script>
</body>
</html>
